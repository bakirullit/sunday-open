  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"so-clubs\"><sc-for list=\"{{ clubList }}\" as=\"cl\" hint-placeholder-count=\"0\"><option value=\"{{ cl }}\"><\u002Foption><\u002Fsc-for><\u002Fdatalist><\u002Flabel>\n<div style=\"display:flex;flex-direction:column;gap:6px;\">\n<span style=\"font-weight:700;font-size:14px;\">Роль<\u002Fspan>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n<sc-for list=\"{{ roles }}\" as=\"rl\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ rl.pick }}\" style=\"border:1px solid {{ rl.border }};background:{{ rl.bg }};color:{{ rl.fg }};cursor:pointer;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;\">{{ rl.name }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size:13px;color:#6A75A0;\">Организатор получает списки участников событий своего клуба и отмечает вход по QR<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n<button sc-camel-on-click=\"{{ saveMe }}\" style=\"border:0;cursor:pointer;background:#1F9D63;color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px;\">{{ saveLabel }}<\u002Fbutton>\n<span style=\"font-size:13px;color:#5B6690;\">{{ meNote }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;border-radius:18px;padding:clamp(16px,2.5vw,28px);box-shadow:0 1px 0 #E3E9F4;display:flex;flex-direction:column;gap:14px;\">\n<div style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;\">Мои регистрации<\u002Fdiv>\n<sc-if value=\"{{ noRsvps }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-size:14px;color:#5B6690;text-wrap:pretty;\">Пока ничего. Откройте «План» и нажмите «Зарегистрироваться» у события.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{ myRsvps }}\" as=\"rv\" hint-placeholder-count=\"0\">\n<div style=\"background:#F5F8FC;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;\">\n<div style=\"display:flex;flex-direction:column;gap:2px;\">\n<div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:16px;\">{{ rv.title }}<\u002Fdiv>\n<div style=\"font-size:13px;color:#2C63B8;font-weight:700;\">{{ rv.when }}<\u002Fdiv>\n<\u002Fdiv>\n{{ rv.qrImg }}\n<div style=\"font-size:13px;color:#5B6690;\">{{ rv.note }}<\u002Fdiv>\n<button sc-camel-on-click=\"{{ rv.cancel }}\" style=\"border:0;background:transparent;color:#C0392B;cursor:pointer;font-size:13px;\">Отменить регистрацию<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCal }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#fff;border-radius:18px;padding:clamp(16px,2.5vw,28px);box-shadow:0 1px 0 #E3E9F4;display:flex;flex-direction:column;gap:14px;\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n<div style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px;\">{{ monthLabel }}<\u002Fdiv>\n<div style=\"display:flex;gap:6px;\">\n<button sc-camel-on-click=\"{{ prevMonth }}\" style=\"border:1px solid #C9D3EA;background:#fff;cursor:pointer;border-radius:10px;padding:8px 14px;font-weight:700;\">‹<\u002Fbutton>\n<button sc-camel-on-click=\"{{ nextMonth }}\" style=\"border:1px solid #C9D3EA;background:#fff;cursor:pointer;border-radius:10px;padding:8px 14px;font-weight:700;\">›<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size:13px;color:#5B6690;\">В календаре всё, у чего стоит дата. Цвет показывает этап. Нажмите на событие, чтобы открыть карточку.<\u002Fdiv>\n<div style=\"overflow-x:auto;\">\n<div style=\"min-width:640px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;\">\n<sc-for list=\"{{ weekdays }}\" as=\"w\" hint-placeholder-count=\"7\"><div style=\"font-size:12px;font-weight:700;color:#6A75A0;padding:4px 6px;text-transform:uppercase;\">{{ w }}<\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"35\">\n<div style=\"min-height:92px;background:{{ d.bg }};border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;\">\n<div style=\"font-size:13px;font-weight:700;color:{{ d.fg }};\">{{ d.num }}<\u002Fdiv>\n<sc-for list=\"{{ d.items }}\" as=\"e\" hint-placeholder-count=\"0\">\n<button sc-camel-on-click=\"{{ e.open }}\" style=\"border:0;cursor:pointer;text-align:left;background:{{ e.color }};color:#fff;font-size:12px;font-weight:700;line-height:1.25;padding:4px 6px;border-radius:6px;\">{{ e.title }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px 16px;flex-wrap:wrap;font-size:13px;color:#5B6690;\">\n<sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"8\"><div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:{{ l.color }};\"><\u002Fspan>{{ l.name }}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ hasUndated }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #E3E9F4;padding-top:14px;\">\n<div style=\"font-weight:700;font-size:14px;\">Без даты<\u002Fdiv>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n<sc-for list=\"{{ undated }}\" as=\"e\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ e.open }}\" style=\"border:1px solid #C9D3EA;background:#fff;cursor:pointer;border-radius:999px;padding:6px 12px;font-size:13px;\">{{ e.title }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;right:16px;bottom:16px;z-index:50;width:min(420px, calc(100vw - 32px));height:min(680px, calc(100vh - 32px));box-shadow:0 18px 48px rgba(20,33,77,.35);background:#14214D;color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;\">\n<div style=\"display:flex;flex-direction:column;gap:2px;\">\n<div style=\"font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;\">ИИ-помощник<\u002Fdiv>\n<div style=\"font-size:13px;color:#B9C4E0;\">{{ chatContext }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ clearChat }}\" style=\"border:0;background:transparent;color:#B9C4E0;cursor:pointer;font-size:13px;\">Очистить<\u002Fbutton>\n<\u002Fdiv>\n<div ref=\"{{ chatRef }}\" style=\"flex:1;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;\">\n<sc-if value=\"{{ chatEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#22316A;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;text-wrap:pretty;\">Опишите мероприятие своими словами: что, для кого, когда, где. Я разложу это по полям, спрошу о том, чего не хватает, и предложу текст. Бюджет, даты и имена не придумываю.<\u002Fdiv>\n<div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n<sc-for list=\"{{ quick }}\" as=\"q\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ q.go }}\" style=\"border:1px solid #3B4C8C;background:transparent;color:#fff;cursor:pointer;border-radius:999px;padding:6px 12px;font-size:13px;\">{{ q.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"0\">\n<sc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"align-self:flex-end;max-width:88%;background:#288ECE;border-radius:14px 14px 4px 14px;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;\">{{ m.text }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ m.isBot }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"align-self:flex-start;max-width:94%;background:#22316A;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:10px;\">\n<div style=\"white-space:pre-wrap;text-wrap:pretty;\">{{ m.text }}<\u002Fdiv>\n<sc-if value=\"{{ m.hasFields }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#14214D;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;\">\n<sc-for list=\"{{ m.fields }}\" as=\"pf\" hint-placeholder-count=\"2\">\n<div style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:12px;font-weight:700;color:#FCC52A;\">{{ pf.label }}<\u002Fspan><span style=\"font-size:13px;white-space:pre-wrap;\">{{ pf.value }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<button sc-camel-on-click=\"{{ m.apply }}\" style=\"align-self:flex-start;border:0;cursor:pointer;background:#FCC52A;color:#14214D;font-weight:700;font-size:13px;padding:7px 12px;border-radius:8px;\">{{ m.applyLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ m.isErr }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#5A1F2A;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;text-wrap:pretty;\">{{ m.text }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<sc-if value=\"{{ busy }}\" hint-placeholder-val=\"{{ false }}\">{{ dots }}<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:flex-end;\">\n<textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" sc-camel-on-key-down=\"{{ draftKey }}\" rows=\"2\" placeholder=\"Например: хотим 15 ноября турнир по спидкубингу для школьников, человек 40\" style=\"flex:1;min-height:48px;max-height:160px;resize:none;border:0;border-radius:12px;padding:10px 12px;background:#fff;color:#14214D;line-height:1.4;\"><\u002Ftextarea>\n<button sc-camel-on-click=\"{{ send }}\" style=\"border:0;cursor:pointer;background:#FCC52A;color:#14214D;font-weight:800;padding:12px 14px;border-radius:12px;\">→<\u002Fbutton>\n<\u002Fdiv>\n<details style=\"font-size:12px;color:#B9C4E0;\">\n<summary style=\"cursor:pointer;\">Подключение<\u002Fsummary>\n<div style=\"display:flex;flex-direction:column;gap:6px;padding-top:8px;\">\n<div style=\"text-wrap:pretty;\">По умолчанию помощник работает через Google Таблицу: ключ хранится в свойствах скрипта и не виден на сайте. Личный ключ ниже сохраняется только в этом браузере.<\u002Fdiv>\n<input type=\"password\" value=\"{{ apiKey }}\" sc-camel-on-change=\"{{ setKey }}\" placeholder=\"sk-or-… (необязательно)\" style=\"padding:8px 10px;border-radius:8px;border:0;background:#22316A;color:#fff;font-size:13px;\">\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SYNC_URL='https://script.google.com/macros/s/AKfycbx6bzomSC7jcF0HeaDKd6NgC-WmujTvMzQNls5Ow14pxpMvDvgwOFTv-2FM6NsOsp161w/exec';\nconst TB='portal', KEY='sunday-open-portal', MODEL='openrouter/free';\nconst LS={get(k,d){try{const v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v));}catch(e){}}};\nconst STAGES=['Идея','Одобрена','Паспорт','Утверждён','Подготовка','Проведён','Закрыт','Отложен','Отклонена'];\nconst SC={'Идея':'#8A94B8','Одобрена':'#288ECE','Паспорт':'#6B5BD6','Утверждён':'#1F9D63','Подготовка':'#D9821A','Проведён':'#2B3A8D','Закрыт':'#5B6478','Отложен':'#A0A7BD','Отклонена':'#C0392B'};\nconst OLD_STAGE={'На доработке':'Идея','Паспорт на проверке':'Паспорт','Go':'Утверждён'};\nconst normStage=s=>OLD_STAGE[s]||s||'Идея';\nconst PASS_STAGES=['Одобрена','Паспорт','Утверждён','Подготовка','Проведён','Закрыт'];\nconst IDEA=[['title','Название','line','Рабочее название мероприятия'],['club','Клуб или команда','line','Кто подаёт идею'],['contact','Контакт','line','Telegram или телефон ответственного'],['date','Дата','date','Если точной даты нет, оставьте пустым'],['what','What — что проводим','text','Формат и суть в 2–3 предложениях'],['why','Why — зачем','text','Цель и KPI: что получат участники'],['who','Who — для кого и кто организует','text','Аудитория, кто в команде'],['reach','Охват','line','Сколько участников ждём, например 10–15'],['where','Where — где','text','Зал или площадка, вместимость'],['how','How — как проводим','text','Программа, этапы, формат входа'],['need','Что потребуется от штаба','text','Помещение, техника, деньги, продвижение, партнёры']];\nconst PASS=[['owner','Владелец проекта (Project owner)','line','Один человек, с которого спрашивают результат. Нет владельца — нет события'],['deputy','Второй ответственный','line','Подхватит, если владелец не сможет'],['goal','Цель и результат','text','Что должно получиться: довольные люди, а не «провели ивент»'],['scope_in','Входит','text','Например: турнир, судейство федерации, награждение'],['scope_out','Не входит','text','Явно: концерт, фуд-корт, доп. категории'],['results','KPI','text','Участники, охват, отзывы — заложить с самого начала'],['timeline','Свои шаги клуба','text','Промежуточные дела между вехами: анонс, регистрация, репетиция'],['budget','Смета','text','Позиция, количество, цена. Если расходов нет, так и написать'],['funding','Кто платит','text','Модель входа, спонсоры, призы. Обещание спонсора — только письменно'],['breakeven','Безубыточность (Break-even)','text','Сколько участников или продаж нужно, чтобы выйти в ноль. Если вход бесплатный, так и написать'],['stakeholders','Кого уведомить и когда','text','Службы AITU, федерация, клубы других вузов, родители, партнёры'],['resources','Зал и техника','text','Зал — заявка через офис за 7+ дней. Техника — тест за день'],['volunteers','Волонтёры','text','Сколько нужно (+20% к расчёту), кто подтвердил в пятницу, резерв'],['risks','Топ-3 риска и план Б','text','Риск → вероятность × влияние → стратегия (избежать, снизить, передать, принять) → план Б и кто решает']];\nconst DOMAINS=[\n{n:'01',name:'Управление',en:'Governance',q:'Кто решает и как?',tip:'Штаб утверждает паспорт. У события есть владелец и второй ответственный. Площадки, призы и коммерческие форматы — только через офис. Типичная ошибка: решения в личке, штаб узнаёт о переносе последним.',keys:['owner','deputy'],gov:true},\n{n:'02',name:'Содержание',en:'Scope',q:'Что входит и что нет?',tip:'«Не входит» записано в паспорте, а не держится в голове. Типичная ошибка: «а давайте ещё…» за неделю до события — scope creep.',keys:['goal','scope_in','scope_out','results']},\n{n:'03',name:'Сроки',en:'Schedule',q:'Какие вехи и когда?',tip:'Паспорт утверждается не позже чем за 4 недели. Даты вех считаются от даты события. Статус вех — на планёрке в понедельник.',keys:[],ms:true,extra:['timeline']},\n{n:'04',name:'Финансы',en:'Finance',q:'Сколько стоит, кто платит?',tip:'Смета — в общей таблице, а не на одном ноутбуке. Типичная ошибка: смета «без сумм» или смета, которую видит только автор.',keys:['budget','funding','breakeven']},\n{n:'05',name:'Стейкхолдеры',en:'Stakeholders',q:'Кого касается и как общаемся?',tip:'Недельный цикл: анонс в понедельник, итоги — в понедельник после события. Типичная ошибка: вспомнить о родителях в день события, без согласий на фото.',keys:['stakeholders']},\n{n:'06',name:'Ресурсы',en:'Resources',q:'Какие люди, залы, техника?',tip:'Зал — через офис не позже чем за 7 дней. Волонтёры — плюс 20%, подтверждение в пятницу. Типичная ошибка: «волонтёры сами придут».',keys:['resources','volunteers']},\n{n:'07',name:'Риски',en:'Risk',q:'Что пойдёт не так, какой план Б?',tip:'Пример: травма на армрестлинге — судья федерации, медик, расписка участника. План Б — остановить поединок, вызвать скорую. Типичная ошибка: «разберёмся на месте».',keys:['risks']}];\nconst COMMITTEES=['Программа и клубы','Ивенты','Медиа','Партнёры','Комьюнити','Стартапы'];\nconst MS=[['Идея одобрена',null,'Заявка 5W1H одобрена штабом'],['Паспорт утверждён',-28,'Паспорт по 7 доменам утверждён штабом'],['Ресурсы подтверждены',-7,'Зал, регистрация, волонтёры'],['Партнёры подтверждены',-5,'Призы и спонсоры — письменно'],['Готовность',-3,'Инструктаж, смета, план Б'],['Событие проведено',0,'Событие состоялось'],['Проект закрыт',2,'Отчёт: цифры, деньги, отзывы, уроки']];\nconst GAMING='Студенты, интересующиеся мобильным, консольным и ПК-геймингом.',ROOMS='С1.3.267P, C1.3.264L, C1.3.263P, C1.3.262P';\nconst PLAN=[\n['plan-1','2026-10-25','Кино Квиз','TYF Media+ KINO Club','Квиз развлекательный','Соберем 2 команды и они будут играть несколько раундов','студенты','10-15','C1.2.233','Телевизор (доска интерактивная), маркеры, стикеры, микрофон, ПРИЗЫ'],\n['plan-2','2026-10-25','Турнир по армрестлингу локально','Armwrestling Club','Пропаганда спорта','Локальный турнир подготовка к межуниверситетскому','студенты','35+','Cyber Arena','Стол для армрестлинга, ПРИЗЫ, обычный стол (1 шт) и стулья (2 шт), медики для безопасности'],\n['plan-3','2026-10-25','Турнир по \"Root\"','Board Games Club','Развлекательный турнир','Соревнование между студентами: кто является лучшим стратегом в Root','студенты','10-15','C1.1.252','ПРИЗЫ'],\n['plan-4','2026-10-25','Open Sunday Tournmament 2','AITU Gaming','Развлекательные турниры','Мультидисциплинарный турнир по трем направлениям: Valorant (формат 2х2), Brawl Stars (режим Brawl Ball, формат 3х3), UFC (формат 1х1)',GAMING,'40–80',ROOMS,'PS5, Телевизор (доска)','24–25.10.2026'],\n['plan-5','2026-11-01','Electronics Workshop','AITU Electronics x FabLab AITU','Доп знания по электронике','Дать людям всех возрастов старт в изучении электроники, на мастер классе мы поможем собрать простой проект и объясним все что непонятно','школьники, студенты, взрослые','~12','FabLab','—'],\n['plan-6','2026-11-01','Go Game Masterclass','AITU JCA','Обучение игре го, база для новичков и практика','Для кого угодно, кто пожелает посетить мероприятие, будет открытый вход на мастер-класс. Там будут люди из Федерации Го, будет обучение. Подробности проведения будут в лс у менеджеров ДСВР','Кто угодно','10-50','Atameken Space','кабинет и экран (проектор или экран для демонстрации)'],\n['plan-7','2026-11-01','Open Sunday Tournmament 3','AITU Gaming','Развлекательные турниры','Мультидисциплинарный турнир по трем направлениям: Dota 2 (формат 1х1), Clash Royale (формат 1х1), EAFC (формат 2х2)',GAMING,'40–80',ROOMS,'PS5, Телевизор (доска), призы'],\n['plan-8','2026-11-01','Opens Sunday DnD Open Table','Board Games Club','Развлекательные игры','Дать людям возможность познакомится с DnD в простом и забавном формате','школьники, студенты, взрослые','10-25','С1.3.235, С1.3.237','—'],\n['plan-9','2026-11-08','Kazakh Mythology Lecture and Discussion','AITU SERIN','Продвижение казахской культуры и чтения','Лекция про казахский фольклор, квиз с призами и обсуждение книги','студенты, взрослые, школьники','10-20','','Экран для презентации и кабинет']\n].map((r,i)=>({_id:'portal-'+r[0],_o:100+i,date:r[1],title:r[2],club:r[3],why:r[4],what:r[5],who:r[6],reach:r[7],where:r[8],need:r[9],how:r[10]||'',stage:r[1]<'2026-11-03'?'Проведён':'Одобрена'}));\nconst OLD=[\n['portal-seed-1','Семейное воскресенье','Sunday Open','2026-11-08','Одобрена','Детские мастер-классы, IT-квиз Polaris для школьников, экскурсия в кибер-арену и VR'],\n['portal-seed-2','Спидкубинг','уточнить','','Идея','Соревнование в середине ноября'],\n['portal-seed-3','NKO Connect','Соцпроекты','','Идея','Встреча НКО и студенческих инициатив, конец ноября'],\n['portal-seed-4','IT Fest','4 вуза сети','2026-12-04','Одобрена','Зоны и мастер-классы для школьников, 4–5 декабря'],\n['portal-seed-5','Christmas / New Year Fest','Арт-клубы','','Идея','Ярмарка со стендами клубов в декабре']\n].map((r,i)=>({_id:r[0],_o:10+i,title:r[1],club:r[2],date:r[3],stage:r[4],what:r[5]}));\nconst SEED=[...PLAN,...OLD,{_id:'portal-arm-open',_o:200,title:'Армрестлинг Open',club:'Armwrestling Club',date:'2026-11-15',stage:'Паспорт',what:'Городской турнир с федерацией',where:'Спортзал, 12:00–17:00',who:'Участники из других вузов, судьи',need:'Призы от спонсоров',scope_in:'Турнир, судейство федерации, награждение',scope_out:'Концерт и фуд-корт',risks:'Травма на армрестлинге: судья федерации, медик, расписка участника. План Б — остановить поединок, вызвать скорую.'}];\nconst SUNDAYS=(()=>{const a=[];for(let t=Date.UTC(2026,9,25);t<=Date.UTC(2026,11,27);t+=7*864e5)a.push(new Date(t).toISOString().slice(0,10));return a;})();\nconst addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};\nconst sundayOf=iso=>{const d=new Date(iso+'T00:00:00Z');return addDays(iso,(7-d.getUTCDay())%7);};\nconst todayIso=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');};\nconst clone=o=>JSON.parse(JSON.stringify(o));\nconst MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];\nconst fmtDate=s=>{if(!s)return 'без даты';const [y,m,d]=s.split('-');return d+'.'+m;};\nconst filled=(r,defs)=>defs.filter(d=>String(r[d[0]]||'').trim()).length;\nconst domDone=(r,dm)=>dm.ms?!!r.date:dm.keys.every(k=>String(r[k]||'').trim());\n\nclass Component extends DCLogic {\n  state=(()=>{const n=new Date();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()>24){m++;if(m>11){m=0;y++;}}\n    return {tab:LS.get('tab','bank'),sel:LS.get('sel',null),server:LS.get('server',{rows:{},deleted:[],deletedVersions:{}}),drafts:LS.get('drafts',{}),sent:LS.get('sent',{}),net:'loading',syncAt:'',sending:null,notice:'',\n      tg:null,openDom:0,me:null,pf:null,meBusy:false,meNote:'',chatOpen:LS.get('chat',typeof window!=='undefined'&&window.innerWidth>=1200),chats:{},draft:'',busy:false,apiKey:LS.get('key',''),calY:y,calM:m};})();\n  chatRef=React.createRef();\n  initTg(n){const w=window.Telegram&&window.Telegram.WebApp;\n    if(!w){if((n||0)<30)setTimeout(()=>this.initTg((n||0)+1),150);return;}\n    if(!w.initData)return;this.tgApp=w;\n    try{w.ready();w.expand();if(w.setHeaderColor)w.setHeaderColor('#2B3A8D');if(w.setBackgroundColor)w.setBackgroundColor('#F5F8FC');}catch(e){}\n    const u=(w.initDataUnsafe&&w.initDataUnsafe.user)||{};\n    this.setState({tg:{initData:w.initData,id:u.id,name:[u.first_name,u.last_name].filter(Boolean).join(' '),username:u.username||''}},()=>this.meApi({}));}\n  async meApi(extra){const tg=this.state.tg;if(!tg)return null;\n    const kind=extra.reg?'reg':extra.rsvp?'rsvp':'me';const body={[kind]:{initData:tg.initData,...(extra[kind]||{})}};\n    try{const j=await this.post(body);\n      if(j&&j.profile){this.setState(s=>({me:j,pf:s.pf&&kind!=='reg'?s.pf:{...j.profile}}));}\n      if(j&&j.ok===false){const m={profile:'Сначала заполните профиль: имя, телефон, клуб и роль.',past:'Это событие уже прошло.',busy:'Таблица занята, попробуйте ещё раз.',auth:'Не удалось подтвердить вход через Telegram. Закройте и откройте портал заново.'}[j.error]||('Ошибка: '+j.error);this.setState({meNote:m});if(j.error==='profile')this.setState({tab:'me'});}\n      return j;}catch(e){this.setState({meNote:'Нет связи с таблицей. Попробуйте позже.'});return null;}}\n  sharePhone(){const w=this.tgApp;if(!w||!w.requestContact){this.setState({meNote:'Обновите Telegram или отправьте боту /register.'});return;}\n    try{w.requestContact(ok=>{if(!ok)return;this.setState({meNote:'Номер получен, обновляю…'});let n=0;const t=setInterval(async()=>{n++;const j=await this.meApi({});if((j&&j.profile&&j.profile.phone)||n>5){clearInterval(t);this.setState({meNote:j&&j.profile&&j.profile.phone?'Номер сохранён.':'Номер ещё не дошёл, обновите вкладку через минуту.'});}},2000);});}catch(e){}}\n  async saveMe(){if(this.state.meBusy)return;this.setState({meBusy:true,meNote:''});const pf=this.state.pf||{};\n    const j=await this.meApi({reg:{profile:{firstName:pf.firstName||'',lastName:pf.lastName||'',email:pf.email||'',club:pf.club||'',role:pf.role||''}}});\n    this.setState({meBusy:false,meNote:j&&j.ok?(j.missing&&j.missing.length?'Сохранено. Не хватает: '+j.missing.join(', '):'Профиль сохранён.'):this.state.meNote});}\n  async rsvp(r,going){if(!this.state.tg)return;const me=this.state.me;\n    if(going&&(!me||(me.missing||[]).length)){this.setState({tab:'me',meNote:'Чтобы записаться на «'+(r.title||'')+'», заполните профиль.'});return;}\n    this.setState({meBusy:true});await this.meApi({rsvp:{event:{id:r._id,title:r.title||'Событие',date:r.date,club:r.club||''},going}});this.setState({meBusy:false});}\n\n  ask(text,cb){const w=this.tgApp;if(w&&w.showConfirm){try{w.showConfirm(text,ok=>{if(ok)cb();});return;}catch(e){}}if(confirm(text))cb();}\n  componentDidMount(){this.initTg(0);\n    try{const q=new URLSearchParams(location.search),sel=q.get('sel'),tab=q.get('tab');if(sel)this.setState({sel,tab:tab||'bank'});else if(tab&&['plan','bank','pass','cal','me'].includes(tab))this.setState({tab});}catch(e){}\n    this.onResize=()=>this.forceUpdate();window.addEventListener('resize',this.onResize);this.pull();this.timer=setInterval(()=>this.pull(),30000);\n    this.dotTimer=setInterval(()=>{if(this.state.busy)this.forceUpdate();},400);}\n  componentWillUnmount(){window.removeEventListener('resize',this.onResize);clearInterval(this.timer);clearInterval(this.dotTimer);}\n  componentDidUpdate(p,s){const st=this.state;\n    ['tab','sel','server','drafts','sent'].forEach(k=>{if(s[k]!==st[k])LS.set(k,st[k]);});\n    if(s.chatOpen!==st.chatOpen)LS.set('chat',st.chatOpen);if(s.apiKey!==st.apiKey)LS.set('key',st.apiKey);\n    if(s.chats!==st.chats||s.busy!==st.busy){const el=this.chatRef.current;if(el)el.scrollTop=el.scrollHeight;}}\n  wide(){return typeof window!=='undefined'&&window.innerWidth>=1200;}\n  stamp(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}\n  srvVer(id){const sv=this.state.server||{};const r=(sv.rows||{})[id];if(r)return r.v||0;return ((sv.deletedVersions||{})[id])||0;}\n  published(){const sv=this.state.server||{rows:{},deleted:[]},m={};\n    SEED.forEach(r=>{m[r._id]={...r};});\n    Object.values(sv.rows||{}).forEach(x=>{if(x&&x.row&&x.row._id)m[x.row._id]={...x.row};}
