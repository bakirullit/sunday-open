services:
  postgres:
    image: postgres:16-alpine
    container_name: sunday-open-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sunday_open}
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "5433:5432"
    volumes:
      - sunday_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sunday_open}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sunday-open-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - sunday_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunday-open-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sunday_open}
      - REDIS_URL=redis://redis:6379/0
      - TZ=${TZ:-Asia/Almaty}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  sunday_postgres_data:
  sunday_redis_data:

